<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rokiu shop</title>
    <link rel="icon" type="image/png" href="https://static.vecteezy.com/system/resources/previews/048/414/289/non_2x/airpods-icon-against-transparent-background-free-png.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: white;
            line-height: 1.6;
        }
        header {
            background-color: #1e1e1e;
            padding: 1rem;
            text-align: center;
            border-bottom: 2px solid #333;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }
        header h1 {
            font-size: 2.5rem;
            letter-spacing: 1px;
        }
        .nav {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }
        .nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }
        .nav a:hover {
            color: #00aaff;
        }

        .main {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            padding: 2rem;
        }

        .product-card {
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            margin: 10px;
            width: 300px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: scale(1.05);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-info {
            padding: 1rem;
            text-align: center;
        }

        .product-info h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .product-info p {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            background-color: #00aaff;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0088cc;
        }

        footer {
            background-color: #1e1e1e;
            text-align: center;
            padding: 1.5rem;
            margin-top: 2rem;
            box-shadow: 0 -4px 8px rgba(0, 0, 0, 0.5);
        }

        footer p {
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>AirPods Shop</h1>
        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class="main">
        <!-- Product 1 -->
        <div class="product-card">
            <img src="https://via.placeholder.com/300x200?text=AirPods+Pro" alt="AirPods Pro" class="product-img">
            <div class="product-info">
                <h2>AirPods Pro</h2>
                <p>$249.99</p>
                <button class="btn">Add to Cart</button>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="product-card">
            <img src="https://via.placeholder.com/300x200?text=AirPods+Gen+2" alt="AirPods Gen 2" class="product-img">
            <div class="product-info">
                <h2>AirPods Gen 2</h2>
                <p>$159.99</p>
                <button class="btn">Add to Cart</button>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="product-card">
            <img src="https://via.placeholder.com/300x200?text=AirPods+Max" alt="AirPods Max" class="product-img">
            <div class="product-info">
                <h2>AirPods Max</h2>
                <p>$549.99</p>
                <button class="btn">Add to Cart</button>
            </div>
        </div>

        <!-- Product 4 -->
        <div class="product-card">
            <img src="https://via.placeholder.com/300x200?text=AirPods+Charging+Case" alt="AirPods Charging Case" class="product-img">
            <div class="product-info">
                <h2>AirPods Charging Case</h2>
                <p>$79.99</p>
                <button class="btn">Add to Cart</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 AirPods Shop. All rights reserved.</p>
    </footer>
</body>
</html>
